[build-system]
requires = ["setuptools>=77.0.3,<80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-glimmer-vllm"
version = "0.1.0"
description = "Muse-Glimmer-30B model for the vLLM Neuron plugin (AWS Trainium)"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []  # runs inside a vllm-neuron environment; does not pin vllm/torch

[project.entry-points."vllm.general_plugins"]
muse_glimmer = "muse_glimmer_vllm:register"

[tool.setuptools.packages.find]
include = ["muse_glimmer_vllm", "muse_glimmer_vllm.*"]
