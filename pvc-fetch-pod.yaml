# Tiny pod (no Neuron device, no ports) that mounts the results PVC so you can kubectl cp
# archives after a job pod has completed. Copy single .tar.gz files only (the PVC is S3-FUSE).
#
#   kubectl apply -f pvc-fetch-pod.yaml
#   kubectl exec pvc-fetch -- ls -la /var/mdl/muse_glimmer/runs/
#   kubectl cp default/pvc-fetch:/var/mdl/muse_glimmer/runs/<file>.tar.gz ./<file>.tar.gz
#   kubectl delete pod pvc-fetch
apiVersion: v1
kind: Pod
metadata:
  name: pvc-fetch
  namespace: default
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 7200
  containers:
    - name: fetch
      image: public.ecr.aws/docker/library/ubuntu:24.04
      command: ["sleep", "7200"]
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 4Gi
      volumeMounts:
        - name: 621547421844-ap-southeast-4-pvc
          mountPath: /var/mdl
  volumes:
    - name: 621547421844-ap-southeast-4-pvc
      persistentVolumeClaim:
        claimName: 621547421844-ap-southeast-4-pvc
