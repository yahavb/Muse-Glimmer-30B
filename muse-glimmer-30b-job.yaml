# Muse-Glimmer-30B inference JOB on trn3 with TorchNeuron (native PyTorch).
#
# m-lnc2 = 2 trn3 devices (chips) = 8 NeuronCores. BF16 weights are ~60GB, too big
# for one core, so we run tensor parallel. TP=2: the model has only 2 KV heads,
# so TP=4 would split a KV head in half.
#
# Launch:
#   kubectl create configmap muse-glimmer-code --from-file=run_muse_glimmer.py --from-file=muse_compile.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl delete job muse-glimmer-30b --ignore-not-found
#   kubectl apply -f muse-glimmer-30b-job.yaml
#   kubectl logs -f job/muse-glimmer-30b
apiVersion: batch/v1
kind: Job
metadata:
  name: muse-glimmer-30b
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: muse-glimmer-30b
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1
      resourceClaims:
        - name: m-lnc2
          resourceClaimTemplateName: m-lnc2
      containers:
        - name: inference
          image: public.ecr.aws/neuron/torch-neuronx:2.14.0-neuronx-py314-sdk2.33.0-ubuntu26.04
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-ec"
            - |
              set -euo pipefail
              python3 -m pip install -q -U "transformers>=5.20" accelerate pillow
              # image processor needs torchvision; pin to the image's torch 2.14.0 and
              # --no-deps so pip can't swap torch (breaks the torch_neuronx ABI).
              python3 -m pip install -q --no-deps torchvision==0.29.0
              python3 -c 'import torch, torchvision, torch_neuronx, transformers; print("torch", torch.__version__, "torchvision", torchvision.__version__, "torch_neuronx", torch_neuronx.__version__, "transformers", transformers.__version__)'

              # /var/mdl (PVC) has no rename/lock support -> HF hub cache breaks there.
              # Keep caches on local disk; download once before torchrun so ranks don't race.
              export HF_HOME=/tmp/hf_cache
              export NEURON_COMPILE_CACHE_URL=/tmp/neuron-compile-cache
              mkdir -p "$HF_HOME" "$NEURON_COMPILE_CACHE_URL"
              python3 -c 'from huggingface_hub import snapshot_download; print(snapshot_download("meta-models/Muse-Glimmer-30B"))'

              COMPILE_FLAG=""; [ "${USE_COMPILE:-0}" = "1" ] && COMPILE_FLAG="--compile"
              torchrun --nproc_per_node="$TP_DEGREE" --master_port=29500 \
                /code/run_muse_glimmer.py --tp $COMPILE_FLAG \
                --max-new-tokens "$MAX_NEW_TOKENS" 2>&1 | tee /tmp/run.txt
              echo "════════ RUN DONE ════════"
          resources:
            claims:
              - name: m-lnc2
            requests:
              cpu: 22
              memory: 220Gi
              ephemeral-storage: 120Gi
            limits:
              cpu: 44
              memory: 400Gi
              ephemeral-storage: 200Gi
          volumeMounts:
            - name: code
              mountPath: /code
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: TORCH_NEURONX_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_FLAGS
              value: "--model-type=transformer"
            - name: TP_DEGREE
              value: "2"
            # 0 = eager first (find op gaps fast); 1 = torch.compile(backend="neuron")
            - name: USE_COMPILE
              value: "1"
            - name: MAX_NEW_TOKENS
              value: "256"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
      volumes:
        - name: code
          configMap:
            name: muse-glimmer-code
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
