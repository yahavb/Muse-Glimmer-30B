# Muse-Glimmer-30B served with vLLM Neuron (plugin 0.29.0.1.2.0, SDK 2.33) on trn3, TP=2.
# Phase 1: text only. The model comes from this repo's out-of-tree plugin
# (vllm_plugin/, registered through vllm.general_plugins) — vllm-neuron is unchanged.
#
# Flow: clone repo -> install plugin -> download weights -> vllm serve (bound to 127.0.0.1, so
# only this pod can reach it) -> smoke client: greedy answer + TTFT / tok/s -> stop.
#
# Launch:
#   kubectl delete job muse-glimmer-30b-vllm --ignore-not-found
#   kubectl apply -f muse-glimmer-30b-vllm-job.yaml
#   kubectl logs job/muse-glimmer-30b-vllm > /tmp/muse-glimmer-30b-vllm
apiVersion: batch/v1
kind: Job
metadata:
  name: muse-glimmer-30b-vllm
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: muse-glimmer-30b-vllm
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1
      resourceClaims:
        - name: m-lnc2
          resourceClaimTemplateName: m-lnc2
      containers:
        - name: vllm
          image: public.ecr.aws/neuron/pytorch-inference-vllm-neuronx:0.29.0.1.2.0-neuronx-py314-sdk2.33.0-ubuntu26.04
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-ec"
            - |
              set -euo pipefail
              JOB_T0=$(date +%s); export STEP_TIMES=/tmp/step_times.tsv; : > "$STEP_TIMES"
              t_mark() {
                local now; now=$(date +%s)
                [ -n "${T_NAME:-}" ] && printf '%s\t%s\n' "$((now - T_START))" "$T_NAME" >> "$STEP_TIMES"
                T_NAME="$1"; T_START=$now
              }
              t_mark "git clone"
              cd /tmp && git clone -b "$BRANCH" "$REPO_URL" repo && cd repo
              GIT_SHA=$(git rev-parse HEAD)
              echo "┌── PROVENANCE ──"
              echo "│ repo   : $REPO_URL  branch: $(git rev-parse --abbrev-ref HEAD) (requested $BRANCH)"
              echo "│ commit : $GIT_SHA"
              echo "│ subject: $(git log -1 --pretty=%s)"
              echo "└────────────────"

              t_mark "install plugin"
              python3 -m pip install -q --no-deps -e vllm_plugin
              python3 -c 'import vllm, vllm_neuron, transformers, torch; from importlib.metadata import entry_points as e; print("PROVENANCE STACK: vllm", vllm.__version__, "torch", torch.__version__, "transformers", transformers.__version__, "| general plugins:", sorted(x.name for x in e(group="vllm.general_plugins")))'
              python3 -c 'from transformers import AutoConfig; import transformers.models.muse_glimmer as m; print("PROVENANCE transformers has muse_glimmer:", m.__name__)'

              t_mark "model download"
              export HF_HOME=/tmp/hf_cache; mkdir -p "$HF_HOME"
              MODEL_DIR=$(python3 -c 'from huggingface_hub import snapshot_download; print(snapshot_download("meta-models/Muse-Glimmer-30B"))')
              echo "MODEL_DIR=$MODEL_DIR"

              if [ "$CPU_CHECK" = "1" ]; then
                t_mark "CPU-mode tiny check (vLLM vs HF, greedy)"
                echo "════════ CPU-MODE TINY CHECK ════════"
                VLLM_NEURON_CPU_MODE=1 python3 vllm_plugin/tests/test_tiny_cpu.py \
                  --config "$MODEL_DIR/config.json" --tp 1 2 2>&1 | tee /tmp/cpu_check.txt \
                  | grep -E "HF reference|TP=|RESULT|Error|Traceback" || true
                grep -q "RESULT: PASS" /tmp/cpu_check.txt || { echo "CPU CHECK did not pass — not starting the device server"; tail -60 /tmp/cpu_check.txt; exit 1; }
              fi

              t_mark "vllm serve: load + compile + warmup"
              echo "════════ VLLM SERVE (TP=$TP_DEGREE) ════════"
              vllm serve "$MODEL_DIR" --served-model-name meta-models/Muse-Glimmer-30B \
                --host 127.0.0.1 --port 8000 \
                --tensor-parallel-size "$TP_DEGREE" --max-model-len "$MAX_MODEL_LEN" \
                --max-num-seqs "$MAX_NUM_SEQS" --max-num-batched-tokens "$MAX_NUM_BATCHED_TOKENS" \
                --additional-config "$ADDITIONAL_CONFIG" > >(tee /tmp/vllm_server.log) 2>&1 &
              SERVER=$!
              for _ in $(seq 1 720); do  # up to 2h for compile
                curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1 && break
                kill -0 "$SERVER" 2>/dev/null || { echo "SERVER EXITED — engine errors:"; grep -nE "ERROR|Error|error:" /tmp/vllm_server.log | grep -v APIServer | head -60; exit 1; }
                sleep 10
              done
              curl -sf http://127.0.0.1:8000/health >/dev/null || { echo "SERVER NOT READY — engine errors:"; grep -nE "ERROR|Error|error:" /tmp/vllm_server.log | grep -v APIServer | head -60; exit 1; }
              echo "server ready"; grep -iE "warmup|compil|bucket|NEFF|KV cache|blocks" /tmp/vllm_server.log | tail -15 || true

              t_mark "smoke client (2 greedy requests)"
              python3 vllm_plugin/tests/serve_smoke_client.py --url http://127.0.0.1:8000 \
                --model meta-models/Muse-Glimmer-30B --max-tokens 256 --runs 2 || echo "CLIENT FAILED"
              t_mark ""
              kill "$SERVER" 2>/dev/null || true; wait "$SERVER" 2>/dev/null || true
              echo "════════ SERVER LOG (errors / tail) ════════"
              grep -iE "error|traceback|exception" /tmp/vllm_server.log | head -20 || true
              tail -20 /tmp/vllm_server.log
              echo "════════ E2E TIMING ════════"
              python3 scripts/print_step_times.py "$STEP_TIMES" "$(( $(date +%s) - JOB_T0 ))"
              echo "════════ RUN DONE ($GIT_SHA) ════════"
          resources:
            claims:
              - name: m-lnc2
            requests:
              cpu: 22
              memory: 220Gi
              ephemeral-storage: 120Gi
            limits:
              cpu: 44
              memory: 400Gi
              ephemeral-storage: 200Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            # the image may carry torch-neuronx too; vllm-neuron compiles via libtorch-neuronx-lite
            - name: TORCH_DEVICE_BACKEND_AUTOLOAD
              value: "0"
            # native torch.compile path (vllm-neuron's default; explicit for provenance).
            # See https://awsdocs-neuron.readthedocs-hosted.com/en/latest/inference-native-pytorch.html
            - name: VLLM_NEURON_BACKEND
              value: "neuron_native"
            - name: REPO_URL
              value: "https://github.com/yahavb/Muse-Glimmer-30B.git"
            - name: BRANCH
              value: "exp/vllm-phase1"
            - name: CPU_CHECK
              value: "0"
            - name: TP_DEGREE
              value: "2"
            - name: MAX_MODEL_LEN
              value: "4096"
            - name: MAX_NUM_SEQS
              value: "4"
            - name: MAX_NUM_BATCHED_TOKENS
              value: "2048"
            # few buckets -> few NEFFs -> shorter first compile
            - name: ADDITIONAL_CONFIG
              value: '{"neuron_config": {"num_batched_tokens_buckets": [512, 2048], "num_seqs_buckets": [1, 4]}}'
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
