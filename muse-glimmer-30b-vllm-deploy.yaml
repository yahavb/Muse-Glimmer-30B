# Muse-Glimmer-30B on vLLM Neuron (trn3): long-running server for text, image and video.
# Same settings as the validated job (muse-glimmer-30b-vllm-job.yaml). See docs/DEPLOY_VLLM.md.
#
# vLLM listens on 0.0.0.0:8000 (owner's decision): any pod in the cluster can call it at
# <pod IP>:8000 or the Service below, without authentication. ClusterIP only: not reachable from outside.
#   kubectl apply -f muse-glimmer-30b-vllm-deploy.yaml
#   kubectl rollout status deploy/muse-glimmer-30b-vllm --timeout=60m   # first start compiles ~12 min
#   kubectl port-forward deploy/muse-glimmer-30b-vllm 8000:8000         # from your laptop
#
# Node cache (hostPath /opt/muse-glimmer-30b): weights and compiled NEFFs survive restarts.
# NEFF_SOURCE=compile (default) compiles on a cache miss and writes the NEFFs there;
# NEFF_SOURCE=hostpath refuses to start without NEFFs there (no fail-on-miss flag in 0.29).
# Device health and fault injection: docs/RESILIENCE_VLLM.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: muse-glimmer-30b-vllm
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate  # the claim holds the chips; never run two pods at once
  selector:
    matchLabels:
      app: muse-glimmer-30b-vllm
  template:
    metadata:
      labels:
        app: muse-glimmer-30b-vllm
    spec:
      nodeSelector:
        node-type: trn3-dev1
      terminationGracePeriodSeconds: 5  # a hung rank never exits cleanly; don't wait 30 s
      resourceClaims:
        - name: m-lnc2
          resourceClaimTemplateName: m-lnc2
      containers:
        - name: vllm
          image: public.ecr.aws/neuron/pytorch-inference-vllm-neuronx:0.29.0.1.2.0-neuronx-py314-sdk2.33.0-ubuntu26.04
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-ec"
            - |
              set -euo pipefail
              cd /tmp && rm -rf repo && git clone "$REPO_URL" repo && cd repo && git checkout -q "$GIT_REF"
              echo "PROVENANCE commit: $(git rev-parse HEAD)"
              python3 -m pip install -q --no-deps -e vllm_plugin
              # Node cache (hostPath, local disk): HF weights, NEFFs and NKI kernels survive restarts.
              # Native route (libtorch-neuronx-lite): NEFFs in $VLLM_CACHE_ROOT/neuron/native_neff_cache,
              # keyed by graph + versions + compiler args. NKI kernel binaries must live on the node
              # cache too: their index is under $VLLM_CACHE_ROOT, so binaries in the container's
              # /var/tmp go missing after a restart (NCC_EVRF059 "kernel file does not exist").
              export HF_HOME=/node-cache/hf_cache VLLM_CACHE_ROOT=/node-cache/vllm_cache NKI_COMPILE_CACHE_URL=/node-cache/nki_cache
              mkdir -p "$HF_HOME" "$VLLM_CACHE_ROOT" "$NKI_COMPILE_CACHE_URL"
              # Drop NKI index entries whose kernel binary is gone (from before the fix).
              python3 - "$VLLM_CACHE_ROOT/neuron/compile_cache/nki" <<'PY'
              import base64, glob, json, os, sys
              for f in glob.glob(os.path.join(sys.argv[1], "*.json")):
                  try:
                      b = json.loads(base64.b64decode(json.load(open(f))["dumped_config"]))["klir_binary"]["binary"]
                  except Exception:
                      continue
                  if not os.path.exists(b):
                      for x in (f, f[:-5] + ".lock"):
                          if os.path.exists(x):
                              os.remove(x)
                      print(f"dropped stale NKI index {os.path.basename(f)} (missing {b})")
              PY
              NEFF_DIR="$VLLM_CACHE_ROOT/neuron/native_neff_cache"
              N_NEFF=$(find "$NEFF_DIR" -name '*.neff' 2>/dev/null | wc -l || true)
              # Same count after a restart = every graph came from the cache (nothing compiled).
              echo "NEFF cache: $NEFF_DIR has $N_NEFF NEFFs at start, NEFF_SOURCE=$NEFF_SOURCE"
              case "$NEFF_SOURCE" in
                compile) ;;
                hostpath)
                  # vllm-neuron 0.29.0.1.2.0 has no fail-on-cache-miss flag, so a miss would still
                  # compile; this only refuses to start without NEFFs on the node.
                  [ "$N_NEFF" -gt 0 ] || { echo "NEFF_SOURCE=hostpath but $NEFF_DIR has no NEFFs; run once with NEFF_SOURCE=compile"; exit 1; } ;;
                *) echo "NEFF_SOURCE must be compile or hostpath"; exit 1 ;;
              esac
              MODEL_DIR=$(python3 -c 'from huggingface_hub import snapshot_download; print(snapshot_download("meta-models/Muse-Glimmer-30B"))')
              exec vllm serve "$MODEL_DIR" --served-model-name meta-models/Muse-Glimmer-30B \
                --host 0.0.0.0 --port 8000 \
                --tensor-parallel-size 2 --max-model-len 2048 \
                --max-num-seqs 1 --max-num-batched-tokens 1024 --num-gpu-blocks-override 512 \
                --limit-mm-per-prompt '{"image": 1, "video": 1}' \
                --media-io-kwargs '{"video": {"num_frames": -1}}' \
                --additional-config '{"neuron_config": {"num_batched_tokens_buckets": [1024], "num_seqs_buckets": [1]}, "encoder_neuron_config": {"encoder_attention_block_size": 1024, "num_encoder_input_buckets": [1024, 2080]}}'
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            failureThreshold: 180  # up to 60 min: download + first compile
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
          # Device-level health: proof of life from token counters or a 1-token heartbeat
          # (scripts/vllm_health.py). vLLM's /health alone stays green when a rank hangs.
          # Demo timing: detection within ~10 s of a hang, restart on the first failed probe.
          livenessProbe:
            exec:
              command: ["python3", "/tmp/repo/scripts/vllm_health.py"]
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 1
          resources:
            claims:
              - name: m-lnc2
            requests:
              cpu: 22
              memory: 220Gi
              ephemeral-storage: 120Gi
            limits:
              cpu: 44
              memory: 400Gi
              ephemeral-storage: 200Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: node-cache
              mountPath: /node-cache
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_CC_FLAGS
              value: "--model-type=transformer"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: TORCH_DEVICE_BACKEND_AUTOLOAD
              value: "0"
            - name: VLLM_NEURON_BACKEND
              value: "neuron_native"
            - name: REPO_URL
              value: "https://github.com/yahavb/Muse-Glimmer-30B.git"
            # pin to a validated commit
            - name: GIT_REF
              value: "exp/vllm-phase2"
            # compile: compile on a miss (NEFFs land on the node cache); hostpath: require cached NEFFs.
            - name: NEFF_SOURCE
              value: "compile"
            # Health probe (scripts/vllm_health.py) and fault injection (docs/RESILIENCE_VLLM.md).
            # Fail when the last proof of life is older than HEARTBEAT_S + HEALTH_GRACE_S (8 s).
            - name: HEARTBEAT_S
              value: "4"
            - name: HEALTH_GRACE_S
              value: "4"
            - name: HEARTBEAT_TIMEOUT_S
              value: "5"
            - name: FAULT_INJECTION
              value: "1"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        # Weights + compiled NEFFs, kept on the node across restarts (see the script).
        - name: node-cache
          hostPath:
            path: /opt/muse-glimmer-30b
            type: DirectoryOrCreate
---
# Stable in-cluster name: http://muse-glimmer-30b-vllm.default.svc.cluster.local:8000/v1
# ClusterIP only (no NodePort / LoadBalancer): reachable from inside the cluster, not outside.
apiVersion: v1
kind: Service
metadata:
  name: muse-glimmer-30b-vllm
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: muse-glimmer-30b-vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
